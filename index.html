<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Almanach des Grands Officiers - Officine Universelle Buly 1803</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #15294a; 
            --primary-light: #223f6e;
            --gold: #c5a059;
            --gold-light: #e2c889;
            --parchment: #fbf8f2;
            --parchment-dark: #f2ebd9;
            --ink: #221c19;
            --border-color: #d4c5a9;
        }

           * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Playfair Display', Georgia, serif;
        background-color: var(--parchment);
        color: var(--ink);
        line-height: 1.6;
        padding-bottom: 60px;
    }

    header {
        background-color: #fff;
        border-bottom: 3px double var(--gold);
        padding: 35px 20px 25px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .header-logo-text {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 2.8rem;
        font-style: italic;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 5px;
    }

    .header-subtitle {
        font-family: 'Cinzel', serif;
        font-size: 0.75rem;
        letter-spacing: 5px;
        color: var(--primary-light);
        text-transform: uppercase;
        font-weight: 600;
    }

    .header-title {
        font-family: 'Cinzel', serif;
        font-size: 1.2rem;
        letter-spacing: 3px;
        color: var(--primary);
        text-transform: uppercase;
        margin-top: 25px;
        font-weight: 700;
        position: relative;
        display: inline-block;
    }
    
    .header-title::before, .header-title::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 40px;
        height: 1px;
        background: var(--gold);
    }
    .header-title::before { left: -55px; }
    .header-title::after { right: -55px; }

    nav {
        background-color: var(--primary);
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 5px;
        padding: 8px 10px;
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .nav-btn {
        background: transparent;
        border: 1px solid transparent;
        color: var(--parchment);
        font-family: 'Cinzel', serif;
        font-size: 0.8rem;
        padding: 10px 14px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 2px;
    }

    .nav-btn:hover {
        background-color: rgba(197, 160, 89, 0.2);
        color: var(--gold-light);
    }

    .nav-btn.active {
        background-color: var(--gold);
        color: var(--primary);
        font-weight: 700;
    }

    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
    .tab-content { display: none; animation: fadeIn 0.4s ease-in-out; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .section-title {
        text-align: center;
        font-family: 'Cinzel', serif;
        color: var(--primary);
        font-size: 2.2rem;
        margin-bottom: 10px;
    }
    .section-title::after {
        content: ''; display: block; width: 80px; height: 2px; background: var(--gold); margin: 12px auto 25px;
    }
    .section-desc { text-align: center; font-style: italic; max-width: 700px; margin: 0 auto 35px; color: #555; font-size: 1.1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 25px; }
    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

    /* CARDS & PANELS */
    .panel {
        background: #fff; border: 1px solid var(--border-color); padding: 35px; border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.03); margin-bottom: 30px;
    }
    
    /* HISTORY & PHILOSOPHY */
    .ceremonial-steps {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 30px;
    }
    .ceremonial-step {
        background: #fdfbf3; border: 1px solid var(--border-color); border-top: 3px solid var(--gold);
        padding: 20px; border-radius: 4px; text-align: center;
    }
    .ceremonial-num {
        font-family: 'Cinzel', serif; font-size: 1.2rem; color: var(--gold); font-weight: bold; margin-bottom: 8px; display: block;
    }
    .ceremonial-title { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--primary); margin-bottom: 10px; }
    .ceremonial-desc { font-size: 0.9rem; color: #555; font-style: italic; }

    /* GROOMING & UNIFORMS */
    .commandments-box {
        background: #f4f7fb; border: 2px solid var(--primary); border-radius: 6px; padding: 30px; margin-bottom: 35px;
    }
    .commandments-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 20px;
    }
    .commandment-item {
        background: #fff; border: 1px solid var(--border-color); padding: 15px; border-radius: 4px;
        font-size: 0.9rem; position: relative; padding-left: 40px;
    }
    .commandment-item::before {
        content: '⚖'; position: absolute; left: 12px; top: 12px; font-size: 1.2rem; color: var(--gold);
    }
    .commandment-item.do::before { content: '✓'; color: var(--accent-green); font-weight: bold; }
    .commandment-item.dont::before { content: '✗'; color: var(--accent-burgundy); font-weight: bold; }

    .hair-profile-selector {
        display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 25px;
    }
    .profile-btn {
        background: #fff; border: 1px solid var(--border-color); padding: 8px 16px; font-family: 'Cinzel', serif;
        font-size: 0.8rem; cursor: pointer; border-radius: 3px; transition: all 0.3s;
    }
    .profile-btn.active, .profile-btn:hover {
        background: var(--primary); color: #fff; border-color: var(--primary);
    }
    .hair-guide-panel { display: none; }
    .hair-guide-panel.active { display: block; }

    .tuto-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; }
    @media (max-width: 768px) { .tuto-steps { grid-template-columns: repeat(2, 1fr); } }
    .step-box { background: var(--parchment); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; text-align: center; }
    .step-num { display: inline-block; width: 28px; height: 28px; line-height: 28px; background: var(--primary); color: #fff; border-radius: 50%; font-family: 'Cinzel', serif; font-size: 0.9rem; margin-bottom: 10px; }
    .step-svg { width: 100%; height: 100px; margin: 10px 0; }
    .step-text { font-size: 0.9rem; color: #333; font-weight: 500; }

    /* CATALOG */
    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .catalog-card { background: #fff; border: 1px solid var(--border-color); border-radius: 6px; padding: 25px; text-align: center; transition: transform 0.3s; }
    .catalog-card:hover { transform: translateY(-4px); box-shadow: 0 6px 15px rgba(0,0,0,0.06); }
    .catalog-icon { font-size: 2.5rem; margin-bottom: 15px; display: block; }
    .catalog-title { font-family: 'Cinzel', serif; color: var(--primary); font-size: 1.1rem; margin-bottom: 10px; }
    .catalog-desc { font-size: 0.9rem; color: #666; font-style: italic; }

    /* PRODUCT CARDS */
    .product-card {
        background: #fff; border: 2px solid var(--border-color); border-radius: 6px; overflow: hidden;
        display: flex; flex-direction: column; position: relative;
    }
    .product-header { padding: 30px 20px; text-align: center; border-bottom: 1px solid var(--border-color); background: #fff; }
    .product-svg { height: 200px; margin: 0 auto; display: block; filter: drop-shadow(3px 8px 8px rgba(0,0,0,0.1)); }
    .product-body { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .product-name { font-family: 'Cinzel', serif; font-size: 1.4rem; color: var(--primary); margin-bottom: 5px; }
    .product-sub { font-style: italic; color: #666; margin-bottom: 20px; font-size: 0.9rem; }
    .feature-item { margin-bottom: 15px; font-size: 0.9rem; }
    .feature-label { font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 1px; color: var(--primary); text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 3px; }
    .quote-box { background: var(--parchment); border-left: 3px solid var(--gold); padding: 12px; font-style: italic; font-size: 0.85rem; margin: 15px 0 20px; color: #444; }

    .btn-download {
        background: var(--primary); color: #fff; border: none; padding: 12px 20px; font-family: 'Cinzel', serif; font-size: 0.8rem;
        letter-spacing: 1px; cursor: pointer; width: 100%; border-radius: 3px; transition: background 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px;
    }
    .btn-download:hover { background: var(--gold); color: var(--primary); font-weight: bold; }

    /* FOUNDERS & BOUTIQUES */
    .founder-card {
        background: #fff; border: 1px solid var(--border-color); padding: 30px; border-radius: 6px; text-align: center;
    }
    .founder-avatar {
        width: 120px; height: 120px; border-radius: 50%; background: var(--parchment-dark); border: 2px solid var(--gold);
        margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-size: 1.5rem; color: var(--primary);
    }
    .boutique-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .boutique-card {
        background: var(--parchment); border: 1px solid var(--border-color); border-left: 4px solid var(--primary); padding: 20px; border-radius: 4px;
    }
    .boutique-emblem { font-size: 1.5rem; margin-bottom: 8px; display: block; }
    .boutique-city { font-family: 'Cinzel', serif; color: var(--primary); font-weight: bold; font-size: 1.1rem; margin-bottom: 4px; }
    .boutique-team { font-style: italic; color: var(--gold); font-size: 0.9rem; margin-bottom: 8px; }
    .boutique-mgr { font-size: 0.85rem; color: #555; }

    /* TEMPORAL & NEWS */
    .calendar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 40px; }
    @media (max-width: 900px) { .calendar-grid { grid-template-columns: repeat(2, 1fr); } }
    .month-box { background: #fff; border: 2px solid var(--border-color); border-radius: 6px; padding: 20px 15px; text-align: center; min-height: 150px; display: flex; flex-direction: column; justify-content: flex-start; }
    .month-box.highlight { border-color: var(--primary); background: #f4f7fb; }
    .month-box.gold-highlight { border-color: var(--gold); background: #fdfbf3; }
    .month-name { font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 2px; color: #888; text-transform: uppercase; margin-bottom: 12px; }
    .month-event { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--primary); font-weight: 600; line-height: 1.3; }

    .news-feed { margin-top: 40px; }
    .news-card {
        background: #fff; border: 1px solid var(--border-color); border-radius: 6px; padding: 30px; margin-bottom: 25px;
        position: relative;
    }
    .news-badge {
        display: inline-block; background: var(--gold); color: var(--primary); font-family: 'Cinzel', serif; font-size: 0.75rem;
        padding: 4px 10px; border-radius: 3px; letter-spacing: 1px; font-weight: bold; margin-bottom: 12px;
    }
    .news-title { font-family: 'Cinzel', serif; font-size: 1.4rem; color: var(--primary); margin-bottom: 10px; }
    .news-meta { font-style: italic; color: #666; font-size: 0.85rem; margin-bottom: 15px; }

    .form-publish {
        background: #fff; border: 1px solid var(--border-color); border-radius: 6px; padding: 30px; margin-top: 30px;
    }
    .form-group { margin-bottom: 20px; }
    .form-label { font-family: 'Cinzel', serif; font-size: 0.85rem; color: var(--primary); display: block; margin-bottom: 8px; font-weight: bold; }
    .form-input, .form-textarea {
        width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 4px;
        font-family: 'Playfair Display', serif; font-size: 1rem; background: var(--parchment);
    }
    .form-textarea { min-height: 120px; resize: vertical; }

    footer { text-align: center; padding: 30px 20px 10px; border-top: 1px solid var(--border-color); margin-top: 50px; font-size: 0.85rem; color: #777; }
</style>
